<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14123A">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<title>Iris</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14123A;--ink:#fff;--sig:#FFD23F;--red:#FF5A4E;--ok:#3DDBC0;--mid:#2A2766}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 20px/1.4 'Atkinson Hyperlegible',system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
h1{font-size:44px;margin:8px 0 4px}p.sub{margin:0 0 20px;opacity:.85}
label{display:block;font-weight:700;margin:16px 0 6px}
input,select{width:100%;font:inherit;padding:16px;border-radius:12px;border:3px solid var(--mid);background:#0C0B26;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:4px solid var(--sig);outline-offset:2px}
button{font:700 24px 'Atkinson Hyperlegible',system-ui,sans-serif;width:100%;padding:22px;border:0;border-radius:16px;background:var(--sig);color:#14123A;margin-top:18px}
button.alt{background:var(--ok)}button.stop{background:var(--red);color:#fff}button:disabled{opacity:.5}
.note{font-size:16px;opacity:.85;margin-top:14px}
#run{display:none;position:fixed;inset:0;background:#000}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#msg{position:absolute;left:0;right:0;top:0;padding:max(18px,env(safe-area-inset-top)) 18px 18px;background:rgba(20,18,58,.92);font-size:30px;font-weight:700;min-height:110px;border-bottom:6px solid var(--ok)}
#msg.t0{border-color:var(--red);background:rgba(120,10,10,.95)}#msg.t1{border-color:var(--sig)}
#sub{position:absolute;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));padding:8px 18px;background:rgba(20,18,58,.85);font-size:15px}
#bar{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:10px}
#bar button{margin:0;padding:18px 6px;font-size:20px}
</style></head><body>
<main id="setup">
<h1>Iris</h1><p class="sub">Your walking guide. Set up by voice or by typing, then point your phone ahead and walk.</p>
<button id="vo" class="alt" aria-label="Set up by voice. Iris will ask your language, height and destination.">Set up by voice</button>
<p class="note" id="vs" aria-live="polite"></p>
<label for="h">Your height (cm)</label><input id="h" type="number" inputmode="numeric" value="165" min="100" max="220">
<label for="l">Language</label><select id="l"><option value="en">English</option><option value="sw">Kiswahili</option></select>
<label for="d">Where to? (optional)</label><input id="d" type="text" placeholder="e.g. Konza Technopolis Complex">
<p class="note" id="loc">Finding your location…</p>
<button id="go">Start walking</button>
<p class="note">Iris supports your cane or guide dog. It does not replace them. Hold the phone upright at chest height, camera facing forward.</p>
</main>
<div id="run"><video id="v" playsinline muted></video><canvas id="c"></canvas>
<div id="msg" role="status" aria-live="assertive">Starting…</div><div id="sub"></div>
<div id="bar"><button id="ds" class="alt">What's ahead?</button><button id="vc">Voice</button><button class="stop" id="end">Stop</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const $=id=>document.getElementById(id);
// class: [real height m, risk (3 = vehicle), en, sw]
const OBJ={person:[1.7,1,'Person','Mtu'],bicycle:[1.0,2,'Bicycle','Baiskeli'],car:[1.5,3,'Car','Gari'],motorcycle:[1.3,3,'Motorbike','Pikipiki'],bus:[3,3,'Bus','Basi'],truck:[3,3,'Truck','Lori'],dog:[.5,1,'Dog','Mbwa'],cow:[1.3,2,'Cow','Ng\'ombe'],horse:[1.6,2,'Horse','Farasi'],sheep:[.8,1,'Sheep','Kondoo'],bench:[.8,1,'Bench','Benchi'],chair:[.9,1,'Chair','Kiti'],couch:[.9,1,'Sofa','Kochi'],'dining table':[.75,1,'Table','Meza'],suitcase:[.6,1,'Suitcase','Sanduku'],'fire hydrant':[.7,1,'Hydrant','Bomba la maji'],'potted plant':[.5,1,'Plant','Mmea'],obstacle:[0,1,'Obstacle','Kizuizi']};
const TX={
 en:{stop:'Stop',ahead:'ahead',left:'left',right:'right',step:'step',steps:'steps',move:'Move',then:'then',clear:'Path clear',clearfor:'Clear for',go:'Walk',turn:'Turn',slight:'slightly',around:'Turn around',arrive:'You have arrived',load:'Loading. Please wait.',ready:'Ready. Walk forward.',about:'about',tl:'left',tr:'right',st:'straight on',scene:'In front of you',none:'Nothing detected. Path clear.',askH:'What is your height in centimetres?',askD:'Where do you want to go? Say none to skip.',conf:(h,d)=>`Height ${h} centimetres. ${d?'Going to '+d:'No destination'}. Starting.`,rok:'Route set.',rno:'Could not find that place.',miss:'Sorry, I did not catch that.',nosr:'Voice input is not supported on this browser. Please use the form.',lang:'en-US'},
 sw:{stop:'Simama',ahead:'mbele',left:'kushoto',right:'kulia',step:'hatua',steps:'hatua',move:'Sogea',then:'kisha',clear:'Njia iko wazi',clearfor:'Wazi kwa',go:'Tembea',turn:'Geuka',slight:'kidogo',around:'Geuka nyuma',arrive:'Umefika',load:'Inapakia. Tafadhali subiri.',ready:'Tayari. Tembea mbele.',about:'karibu',tl:'kushoto',tr:'kulia',st:'moja kwa moja',scene:'Mbele yako',none:'Hakuna kitu. Njia iko wazi.',askH:'Urefu wako ni sentimita ngapi?',askD:'Unataka kwenda wapi? Sema hapana kama hakuna.',conf:(h,d)=>`Urefu ${h} sentimita. ${d?'Unaenda '+d:'Hakuna mahali'}. Naanza.`,rok:'Njia imewekwa.',rno:'Sikupata mahali hapo.',miss:'Samahani, sikusikia vizuri.',nosr:'Kivinjari hiki hakisikii sauti. Tumia fomu.',lang:'sw-KE'}};
let L='en',T=TX.en,stride=.68,camH=1.2,running=false,model,stream,tracks=[],nid=0,heading=null,pos=null,route=null,ri=0,wid,lastItems=[],lastText='';
let speaking=false,spP=9,sid=0,lastSpeak=0,lastHaz=0,lastRoute=0,cool={};
const nm=c=>OBJ[c][L==='sw'?3:2], unit=n=>n+' '+(n===1?T.step:T.steps);

/* ---------- audio out: priority arbiter ---------- */
let ac;function beep(f=880,ms=160){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+ms/1000)}catch(e){}}
function say(p,key,text,t,force){
 const gap=[.6,2.5,6][p]??6,kc=p===0?2:5;
 if(!force&&cool[key]&&t-cool[key]<kc)return;
 if(speaking){if(spP===0&&p!==0)return;if(!force&&p>=spP)return;speechSynthesis.cancel()}
 else if(!force&&t-lastSpeak<gap)return;
 cool[key]=t;lastSpeak=t;spP=p;speaking=true;lastText=text;
 if(p===0){beep(1000,150);navigator.vibrate&&navigator.vibrate([200,80,200])}else if(p===1)navigator.vibrate&&navigator.vibrate(100);
 const u=new SpeechSynthesisUtterance(text),id=++sid;u.lang=T.lang;u.rate=1.1;
 u.onend=u.onerror=()=>{if(id===sid){speaking=false;spP=9}};
 speechSynthesis.speak(u);
 const m=$('msg');m.textContent=text;m.className='t'+p;
}
const sp=(text,lang)=>new Promise(r=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=1.05;u.onend=u.onerror=r;speechSynthesis.speak(u)});

/* ---------- audio in: speech recognition ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(lang){return new Promise(res=>{if(!SR)return res(null);const r=new SR();let done=false;r.lang=lang;r.interimResults=false;
 r.onresult=e=>{done=true;res(e.results[0][0].transcript)};r.onerror=r.onend=()=>{if(!done)res(null)};beep(660,90);try{r.start()}catch(e){res(null)}})}
function parseH(s){if(!s)return null;s=s.toLowerCase();let m=s.match(/\b([12])[.,](\d{1,2})\b/);if(m)return Math.round(parseFloat(m[1]+'.'+m[2])*100);
 m=s.match(/(\d)\s*(?:feet|foot|ft|')\s*(\d{1,2})?/);if(m)return Math.round(+m[1]*30.48+(+m[2]||0)*2.54);
 m=s.match(/\d+/);const n=m&&+m[0];return n>=100&&n<=220?n:null}
async function voiceSetup(){
 if(!SR){$('vs').textContent=TX.en.nosr;sp(TX.en.nosr,'en-US');return}
 $('vo').disabled=true;const st=t=>$('vs').textContent=t;
 st('Listening: language…');await sp('Say English, or say Kiswahili. Sema Kiingereza, au sema Kiswahili.','en-US');
 const a=await listen('en-US');L=/swahili|kiswa/i.test(a||'')?'sw':'en';T=TX[L];$('l').value=L;
 let h=null;for(let i=0;i<2&&!h;i++){st('Listening: height…');await sp(T.askH,T.lang);h=parseH(await listen(T.lang));if(!h)await sp(T.miss,T.lang)}
 if(h)$('h').value=h;
 st('Listening: destination…');await sp(T.askD,T.lang);const d=((await listen(T.lang))||'').trim();
 $('d').value=d&&!/^(none|no|skip|hapana|hakuna)/i.test(d)?d:'';
 st(`Height ${$('h').value} cm · ${$('d').value||'no destination'}`);
 await sp(T.conf($('h').value,$('d').value),T.lang);start();
}
async function command(){
 speechSynthesis.cancel();speaking=false;const t=()=>performance.now()/1000;
 const s=((await listen(T.lang))||'').toLowerCase();if(!s)return say(1,'cmd',T.miss,t(),true);
 const m=s.match(/(?:go to|take me to|navigate to|nipeleke|nenda)\s+(.+)/);
 if(m){const ok=pos&&await setupRoute(m[1]);return say(1,'cmd',ok?T.rok:T.rno,t(),true)}
 if(/stop|quit|end|simamisha|maliza/.test(s))return $('end').click();
 if(/repeat|again|rudia/.test(s))return say(1,'cmd',lastText,t(),true);
 describe(t(),false);
}

/* ---------- geo / route ---------- */
const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI;
function dist(a,b){const R=6371e3,dl=rad(b[0]-a[0]),dn=rad(b[1]-a[1]);const x=Math.sin(dl/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function bearing(a,b){const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0])),x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return(deg(Math.atan2(y,x))+360)%360}
navigator.geolocation?.getCurrentPosition(p=>{pos=[p.coords.latitude,p.coords.longitude];$('loc').textContent='Location found ✓'},()=>{$('loc').textContent='Location unavailable. Obstacle guidance will still work.'},{enableHighAccuracy:true});
function onOri(e){heading=e.webkitCompassHeading??(e.absolute&&e.alpha!=null?(360-e.alpha)%360:heading)}
async function setupRoute(q){
 try{
  const g=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))).json();if(!g[0])return false;
  const r=await(await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${pos[1]},${pos[0]};${g[0].lon},${g[0].lat}?overview=false&steps=true`)).json();
  route=r.routes[0].legs[0].steps.map(s=>({ll:[s.maneuver.location[1],s.maneuver.location[0]],mod:s.maneuver.modifier||''}));ri=1;return true;
 }catch(e){route=null;return false}
}
function routeMsg(){
 if(!route||!pos||ri>=route.length)return null;
 let w=route[ri],d=dist(pos,w.ll);
 if(d<8){ri++;if(ri>=route.length)return T.arrive;w=route[ri];d=dist(pos,w.ll)}
 const n=Math.max(1,Math.round(d/stride)),rel=heading==null?0:((bearing(pos,w.ll)-heading+540)%360)-180;
 if(Math.abs(rel)>135)return T.around;
 if(Math.abs(rel)>30)return `${T.turn} ${Math.abs(rel)<60?T.slight+' ':''}${rel<0?T.left:T.right}`;
 const nx=/left/.test(w.mod)?T.tl:/right/.test(w.mod)?T.tr:T.st;
 return `${T.go} ${n>5?T.about+' ':''}${n>8?Math.round(n/5)*5:n} ${T.steps}, ${T.then} ${nx}`;
}

/* ---------- depth model (Depth Anything V2 small) + metric calibration ---------- */
let dpipe,RawImage,dmap=null,cal=null,dBusy=false,prevScan=[],dObs={list:[],t:0};
const dc=document.createElement('canvas');dc.width=252;dc.height=196;
async function loadDepth(){
 try{
  const tf=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');RawImage=tf.RawImage;
  const mk=o=>tf.pipeline('depth-estimation','onnx-community/depth-anything-v2-small',o);
  try{dpipe=navigator.gpu?await mk({device:'webgpu',dtype:'fp16'}):await mk({dtype:'q8'})}catch(e){dpipe=await mk({dtype:'q8'})}
  try{dpipe.processor.image_processor.size={width:252,height:196}}catch(e){}
 }catch(e){dpipe=null;$('sub').textContent='Depth model unavailable: using size-based distance'}
}
function samp(nx,ny){const{d,w,h}=dmap;return d[Math.min(h-1,Math.max(0,Math.round(ny*h)))*w+Math.min(w-1,Math.max(0,Math.round(nx*w)))]}
function dispAt(x,y,w,h,W,H){const a=[];for(let i=0;i<5;i++)for(let j=0;j<5;j++)a.push(samp((x+w*(.2+.15*i))/W,(y+h*(.2+.15*j))/H));a.sort((p,q)=>p-q);return a[12]}
const toM=s=>Math.min(30,1/Math.max(cal.a*s+cal.b,.033));
function depthAt(x,y,w,h,W,H){return dmap&&cal?toM(dispAt(x,y,w,h,W,H)):null}
function calibrate(W,H){
 const A=[];for(const it of lastItems){if(it.cls==='obstacle'||it.trunc||it.ds>12||it.ds<.8)continue;const s=dispAt(...it.box,W,H);if(s>0)A.push([s,1/it.ds])}
 if(A.length<2){const s=dispAt(.4*W,.88*H,.2*W,.06*H,W,H);if(s>0)A.push([s,1/(camH*.866/.41)])} // ground anchor: floor ~2.5 m ahead when phone is level
 if(!A.length)return;
 let a,b=0;const n=A.length,mx=A.reduce((q,p)=>q+p[0],0)/n,my=A.reduce((q,p)=>q+p[1],0)/n;
 const vx=A.reduce((q,p)=>q+(p[0]-mx)**2,0)/n;
 if(n>=3&&vx>(.15*mx)**2){a=A.reduce((q,p)=>q+(p[0]-mx)*(p[1]-my),0)/n/vx;b=my-a*mx}
 else{const r=A.map(p=>p[1]/p[0]).sort((p,q)=>p-q);a=r[r.length>>1]}
 if(!(a>0))return;cal=cal?{a:.5*cal.a+.5*a,b:.5*cal.b+.5*b}:{a,b};
}
function scan(W,H){ // unknown obstacles (poles, walls, kerbs) in three bands ahead, from depth vs expected floor distance
 const f=H/(2*Math.tan(rad(30))),out=[];
 [[.2,.4],[.4,.6],[.6,.8]].forEach((bd,i)=>{let c=0;const ds=[];
  for(let yy=.25;yy<=.9;yy+=.05)for(let xx=bd[0]+.02;xx<bd[1];xx+=.04){c++;const d=toM(samp(xx,yy)),dy=(yy-.5)*H,lim=dy>.05*H?.7*camH*f/dy:3;if(d<lim&&d<8)ds.push(d)}
  if(ds.length/c>.15){ds.sort((p,q)=>p-q);out.push({band:i,d:ds[Math.floor(ds.length*.2)]})}});
 return out}
async function depthTick(){
 if(!dpipe||dBusy||!running)return;dBusy=true;
 try{
  const v=$('v'),W=v.videoWidth,H=v.videoHeight;dc.getContext('2d').drawImage(v,0,0,252,196);
  const o=await dpipe(await RawImage.fromCanvas(dc)),p=o.predicted_depth,s=p.dims;
  dmap={d:p.data,w:s[s.length-1],h:s[s.length-2]};calibrate(W,H);
  if(cal){const now=scan(W,H);dObs={list:now.filter(n=>prevScan.some(q=>q.band===n.band)),t:performance.now()/1000};prevScan=now}
 }catch(e){}
 dBusy=false;
}

/* ---------- perception ---------- */
function perceive(preds,t){
 const v=$('v'),W=v.videoWidth,H=v.videoHeight,f=H/(2*Math.tan(rad(30)));let items=[];
 for(const p of preds){const o=OBJ[p.class];if(!o||p.score<(o[1]===3||p.class==='person'?.5:.55))continue;
  const[x,y,w,h]=p.bbox,trunc=y+h>H-6,ds=Math.min(30,Math.max(.4,o[0]*f/h*(trunc?.8:1))),dd=depthAt(x,y,w,h,W,H),d=dd?(trunc?dd:.6*dd+.4*ds):ds;
  items.push({cls:p.class,cx:x+w/2,cy:y+h/2,d,ds,trunc,s:p.score,risk:o[1],box:p.bbox,ow:w/f*d,lat:(x+w/2-W/2)/f*d});}
 if(t-dObs.t<1.5)for(const o of dObs.list){const x=(.2+.2*o.band)*W;items.push({cls:'obstacle',cx:x+.1*W,cy:.5*H,d:o.d,ds:o.d,s:1,risk:1,box:[x,.3*H,.2*W,.5*H],ow:.8,lat:(o.band-1)*.2*W/f*o.d})}
 const used=new Set();
 for(const it of items){let b=null,bd=1e9;
  for(const tr of tracks){if(tr.cls!==it.cls||used.has(tr))continue;const dd=Math.hypot(tr.cx-it.cx,tr.cy-it.cy);if(dd<bd&&dd<.2*W){bd=dd;b=tr}}
  if(b){const dt=t-b.t;it.d=.6*b.d+.4*it.d;if(dt>0)b.v=b.v*.6+((b.d-it.d)/dt)*.4;Object.assign(b,{cx:it.cx,cy:it.cy,d:it.d,t,seen:t});b.hits++}
  else{b={id:++nid,cls:it.cls,cx:it.cx,cy:it.cy,d:it.d,v:0,t,seen:t,hits:1};tracks.push(b)}
  used.add(b);it.ok=it.cls==='obstacle'||b.hits>=2||it.s>.75; // confirm over 2 frames unless very confident
  it.inPath=Math.abs(it.lat)-it.ow/2<.7;it.ttc=b.v>1?it.d/b.v:99;
  it.tier=(it.risk===3&&((it.ttc<3.5&&Math.abs(it.lat)<2.5)||(it.inPath&&it.d<3))||(it.inPath&&it.d<1.2))?0:(it.inPath&&it.d<3.5)?1:3;
 }
 tracks=tracks.filter(x=>t-x.seen<1);
 items=items.filter(i=>i.ok).sort((a,b)=>a.tier-b.tier||a.d-b.d);lastItems=items;return items;
}
const side=lat=>Math.abs(lat)<.7?T.ahead:lat<0?T.left:T.right;
function avoid(it){const sl=it.lat+it.ow/2+.7,sr=it.ow/2+.7-it.lat,gl=sl<=sr,k=Math.min(4,Math.max(1,Math.ceil(Math.max(0,gl?sl:sr)/stride)));return `${T.move} ${gl?T.left:T.right} ${unit(k)}`}
function describe(t,auto){
 if(!lastItems.length)return say(2,'scene',T.none,t,!auto);
 const near=[...lastItems].filter(i=>i.d<15).sort((a,b)=>a.d-b.d),top=near.slice(0,3);
 if(!top.length)return say(2,'scene',T.none,t,!auto);
 const list=top.map(i=>`${nm(i.cls)}, ${side(i.lat)}, ${unit(Math.max(1,Math.round(i.d/stride)))}`).join('. ');
 const ip=near.find(i=>i.inPath),tail=ip?`${T.clearfor} ${unit(Math.max(0,Math.round(ip.d/stride)-1))}.`:T.clear;
 say(2,'scene',`${T.scene}: ${list}. ${tail}`,t,!auto);
}
function decide(items,t){
 const top=items[0];
 if(top&&top.tier===0){lastHaz=t;say(0,'0'+top.cls+side(top.lat),`${T.stop}. ${nm(top.cls)}, ${side(top.lat)}.`,t);return}
 if(top&&top.tier===1){lastHaz=t;say(1,'1'+top.cls+side(top.lat),`${nm(top.cls)} ${side(top.lat)}, ${unit(Math.max(1,Math.round(top.d/stride)))}. ${avoid(top)}.`,t);return}
 if(t-lastHaz>3&&t-lastRoute>8){const r=routeMsg();if(r){lastRoute=t;say(2,'route',r,t);return}}
 if(t-lastSpeak>20&&t-lastHaz>5)describe(t,true);
}
function draw(items){
 const v=$('v'),c=$('c');if(c.width!==v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight}
 const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.lineWidth=6;x.font='bold 28px sans-serif';
 for(const it of items){x.strokeStyle=x.fillStyle=['#FF5A4E','#FFD23F','#3DDBC0','#3DDBC0'][it.tier];x.strokeRect(...it.box);x.fillText(`${it.cls} ${it.d.toFixed(1)}m`,it.box[0]+6,it.box[1]+30)}
}
async function loop(){
 if(!running)return;const t=performance.now()/1000;
 try{
  const preds=await model.detect($('v'),15,.4),items=perceive(preds,t);draw(items);decide(items,t);depthTick();
  $('sub').textContent=`${items.length} object(s) · stride ${(stride*100)|0} cm · depth ${cal?'calibrated':dpipe?'warming up':'off'}`+(heading==null?' · no compass':'');
 }catch(e){}
 setTimeout(loop,100);
}

/* ---------- start / stop ---------- */
function applyForm(){L=$('l').value;T=TX[L];const h=+$('h').value||165;stride=.415*h/100;camH=.72*h/100;document.documentElement.lang=L}
async function start(){
 applyForm();
 await sp(T.load,T.lang);
